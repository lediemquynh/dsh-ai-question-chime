# dsh-ai-question-chime bundle patch: one insert over the profile tree.
#
# The plugin row activates only when this package is installed as a profile
# dependency (e.g. `dsh plugin --profile web add dsh-ai-question-chime`).
#
# Behavior is browser-only: Web Audio chime when the assistant asks the user
# a clarifying question (a `?` / `？` in the message, or an `ask_user_question`
# tool call). No host-side code; everything lives in `client/client.js`.
#
# IMPORTANT: this is an `insert`. Do not ALSO declare a top-level `- id:`
# entry for the same id in your own `cordis.patch.yml`, or the plugin would
# register twice (double chime).
- insert:
    - id: ai-question-chime
      name: 'dsh-ai-question-chime'
